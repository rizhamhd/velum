[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "velum-vpn"
version = "0.1.0"
description = "Linux VLESS desktop client with verified full-device routing"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.6"]

[project.scripts]
velum = "velum.main:main"
velum-helper = "velum.services.helper:main"
velum-update = "velum.updates:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "S101", "S603", "S607"]
